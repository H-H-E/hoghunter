name: Verify Hog Hunter

on:
  push:
    branches: [main, hoghunter-completion]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoghunter-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-and-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify wrapper and toolchain
        run: ./gradlew --version
      - name: Check resource graph
        run: python3 tools/verify_resources.py
      - name: Compile
        run: ./gradlew compileJava --no-daemon --console=plain
      - name: Build
        run: ./gradlew build --no-daemon --console=plain
      - name: Datagen bootstrap
        run: ./gradlew runData --no-daemon --console=plain
      - name: GameTests
        run: ./gradlew runGameTestServer --no-daemon --console=plain
      - name: Dedicated server commands
        run: python3 tools/smoke_server.py --timeout 240
      - name: Check exact JAR resources
        run: python3 tools/verify_resources.py --jar build/libs/hoghunter-0.1.0.jar
      - name: Collect build and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hoghunter-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/libs/*.jar
            build/reports/
            run/gametest/logs/
            run/data/logs/
            verification/
